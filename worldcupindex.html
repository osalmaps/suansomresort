<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FIFA World Cup 2026 — Live Scores</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap');

  :root {
    --gold: #C9982A; --gold-light: #F0C755;
    --dark: #0A0F0D; --surface: #1E2E26; --surface2: #243626;
    --text: #F0EDE4; --text2: #9BB09F;
    --live: #E8453C; --border: rgba(255,255,255,0.07);
  }  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; max-width:100vw; background:var(--dark); color:var(--text); font-family:'Barlow',sans-serif; overflow-y:auto; }
  body { display:flex; flex-direction:column; padding:2vh 2.5vw; gap:1.6vh; min-height:100vh; }
  /* Only lock to single screen on very tall displays (Yodeck 2560px+) */
  @media (min-height: 2000px) {
    html, body { height:100vh; overflow:hidden; }
    body { height:100vh; }
  }

  /* HEADER — compact */
  .header { display:flex; flex-direction:column; align-items:center; gap:4px; padding:1.2vh 0 1.4vh; border-bottom:1px solid rgba(201,152,42,0.3); position:relative; flex-shrink:0; }
  .header::before { content:''; position:absolute; bottom:-1px; left:50%; transform:translateX(-50%); width:140px; height:2px; background:var(--gold); }
  .header-title { font-family:'Bebas Neue',sans-serif; font-size:60px; letter-spacing:5px; line-height:0.95; text-align:center; }
  .header-sub { font-family:'Barlow Condensed',sans-serif; font-size:20px; font-weight:600; letter-spacing:6px; color:var(--gold); text-transform:uppercase; }
  .header-host { font-size:15px; color:var(--text2); letter-spacing:2px; }

  /* STATUS BAR */
  .status-bar { display:flex; align-items:center; gap:12px; border-radius:6px; padding:8px 18px; font-family:'Barlow Condensed',sans-serif; font-size:18px; font-weight:700; letter-spacing:2px; flex-shrink:0; }
  .status-bar.live   { background:var(--live); color:white; }
  .status-bar.idle   { background:var(--surface); color:var(--text2); border:1px solid var(--border); }
  .status-bar.error  { background:#2a1010; color:#e87070; border:1px solid rgba(232,70,70,0.3); }
  .live-dot { width:10px; height:10px; border-radius:50%; background:white; animation:pulse 1.2s ease-in-out infinite; flex-shrink:0; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(0.7)} }
  .clock { margin-left:auto; font-size:16px; }

  /* SECTION LABEL */
  .section-label { font-family:'Barlow Condensed',sans-serif; font-size:16px; font-weight:700; letter-spacing:4px; color:var(--gold); text-transform:uppercase; display:flex; align-items:center; gap:12px; flex-shrink:0; }
  .section-label::after { content:''; flex:1; height:1px; background:rgba(201,152,42,0.25); }

  /* MATCH CARD — compact */
  .match-card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px 22px; display:flex; flex-direction:column; gap:8px; position:relative; overflow:hidden; }
  .match-card.is-live { border-color:rgba(232,69,60,0.5); background:linear-gradient(135deg,#1E2E26,#2A1A1A); }
  .live-badge { position:absolute; top:10px; right:14px; font-family:'Barlow Condensed',sans-serif; font-size:13px; font-weight:700; letter-spacing:2px; color:var(--live); }
  .match-meta { display:flex; align-items:center; gap:10px; font-size:13px; color:var(--text2); font-weight:500; letter-spacing:1px; }
  .group-badge { background:var(--gold); color:var(--dark); font-family:'Barlow Condensed',sans-serif; font-size:12px; font-weight:700; letter-spacing:2px; padding:2px 8px; border-radius:3px; }
  .match-main { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .team { display:flex; flex-direction:column; align-items:center; gap:6px; flex:1; }
  .flag { display:inline-flex; align-items:center; justify-content:center; min-width:60px; height:36px; padding:0 10px; background:var(--gold); color:var(--dark); font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:2px; border-radius:5px; line-height:1; }
  .team-logo { width:60px; height:42px; object-fit:contain; filter:drop-shadow(0 2px 4px rgba(0,0,0,0.4)); }
  .upcoming-logo { width:32px; height:24px; object-fit:contain; flex-shrink:0; }
  .logo-sm { width:24px; height:18px; object-fit:contain; flex-shrink:0; }
  .team-name { font-family:'Barlow Condensed',sans-serif; font-size:20px; font-weight:700; letter-spacing:1px; text-align:center; text-transform:uppercase; line-height:1.1; }
  .score-block { display:flex; flex-direction:column; align-items:center; gap:4px; min-width:120px; }
  .score { font-family:'Bebas Neue',sans-serif; font-size:58px; line-height:0.9; letter-spacing:4px; }
  .score.ft { color:var(--text2); }
  .score-status { font-family:'Barlow Condensed',sans-serif; font-size:13px; font-weight:600; letter-spacing:2px; color:var(--text2); }
  .score-status.live-min { color:var(--live); }
  .empty-card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:24px; display:flex; justify-content:center; align-items:center; }
  .empty-msg { font-family:'Barlow Condensed',sans-serif; font-size:16px; color:var(--text2); letter-spacing:1px; text-align:center; line-height:1.6; }

  /* UPCOMING — compact */
  .upcoming-card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:10px 20px; display:flex; align-items:center; gap:18px; }
  .upcoming-date { display:flex; flex-direction:column; align-items:center; min-width:70px; border-right:1px solid rgba(255,255,255,0.1); padding-right:16px; }
  .upcoming-day { font-family:'Bebas Neue',sans-serif; font-size:30px; line-height:1; color:var(--gold-light); }
  .upcoming-month { font-family:'Barlow Condensed',sans-serif; font-size:14px; font-weight:700; letter-spacing:2px; color:var(--text2); text-transform:uppercase; }
  .upcoming-time { font-size:12px; color:var(--text2); margin-top:2px; }
  .upcoming-match { flex:1; display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .upcoming-team { display:flex; align-items:center; gap:10px; }
  .upcoming-flag { display:inline-flex; align-items:center; justify-content:center; min-width:42px; height:26px; padding:0 8px; background:var(--gold); color:var(--dark); font-family:'Bebas Neue',sans-serif; font-size:15px; letter-spacing:1px; border-radius:4px; line-height:1; }
  .upcoming-name { font-family:'Barlow Condensed',sans-serif; font-size:18px; font-weight:700; letter-spacing:1px; }
  .upcoming-vs { font-family:'Bebas Neue',sans-serif; font-size:18px; color:var(--text2); letter-spacing:2px; }
  .upcoming-venue { display:none; }

  /* STANDINGS — compact */
  .standings-card { background:var(--surface); border:1px solid var(--border); border-radius:10px; overflow:hidden; margin-bottom:8px; }
  .standings-group-label { padding:6px 14px; font-family:'Barlow Condensed',sans-serif; font-size:13px; font-weight:700; letter-spacing:2px; color:var(--gold); background:rgba(201,152,42,0.08); border-bottom:1px solid rgba(255,255,255,0.05); display:flex; align-items:center; justify-content:space-between; }
  .group-dots { display:flex; gap:5px; }
  .group-dot { width:6px; height:6px; border-radius:50%; background:rgba(201,152,42,0.25); transition:background 0.4s; }
  .group-dot.active { background:var(--gold); }
  .standings-carousel { position:relative; min-height:240px; }
  .standings-card.rotating { position:absolute; top:0; left:0; right:0; opacity:0; transition:opacity 0.6s ease-in-out; pointer-events:none; }
  .standings-card.rotating.visible { opacity:1; }
  .s-grid { display:grid; grid-template-columns:32px 1fr 36px 36px 36px 36px 48px; }
  .s-header { background:var(--surface2); border-bottom:1px solid rgba(255,255,255,0.08); }
  .s-header > div { padding:6px 6px; font-family:'Barlow Condensed',sans-serif; font-size:12px; font-weight:700; letter-spacing:1px; color:var(--text2); text-transform:uppercase; }
  .s-row { border-bottom:1px solid rgba(255,255,255,0.05); }
  .s-row:last-child { border-bottom:none; }
  .s-row.qualify { border-left:3px solid var(--gold); }
  .s-row.out { opacity:0.4; }
  .s-row > div { padding:8px 6px; display:flex; align-items:center; }
  .pos { font-family:'Barlow Condensed',sans-serif; font-size:15px; font-weight:700; color:var(--text2); }
  .flag-sm { display:inline-flex; align-items:center; justify-content:center; min-width:34px; height:22px; padding:0 5px; background:var(--gold); color:var(--dark); font-family:'Bebas Neue',sans-serif; font-size:13px; letter-spacing:1px; border-radius:3px; line-height:1; }
  .cell-name { font-family:'Barlow Condensed',sans-serif; font-size:16px; font-weight:600; letter-spacing:0.5px; margin-left:8px; }
  .cell-stat { font-size:14px; color:var(--text2); justify-content:center; }
  .cell-pts { font-family:'Bebas Neue',sans-serif; font-size:20px; justify-content:center; }

  /* SKELETONS */
  .skeleton { background:var(--surface); border:1px solid var(--border); border-radius:10px; animation:shimmer 1.5s infinite; }
  @keyframes shimmer { 0%,100%{opacity:0.4} 50%{opacity:0.8} }

  .matches-grid, .upcoming-grid { display:flex; flex-direction:column; gap:8px; }
  .footer { margin-top:auto; text-align:center; font-size:12px; color:rgba(155,176,159,0.4); letter-spacing:1px; padding-top:8px; border-top:1px solid rgba(255,255,255,0.05); flex-shrink:0; }

</style>
</head>
<body>

<div class="header">
  <div style="display:inline-block;width:60px;height:6px;background:var(--gold);margin-bottom:16px;border-radius:3px"></div>
  <div class="header-title">World Cup 2026</div>
  <div class="header-sub">FIFA World Cup 2026</div>
  <div class="header-host">USA · CANADA · MEXICO</div>
</div>

<div class="status-bar idle" id="statusBar">
  <span id="statusText">Loading…</span>
  <span class="clock" id="clock"></span>
</div>

<div class="section-label" id="liveLabel">Today's Matches</div>
<div class="matches-grid" id="liveSection">
  <div class="skeleton" style="height:200px"></div>
  <div class="skeleton" style="height:200px"></div>
</div>

<div class="section-label">Upcoming Fixtures</div>
<div class="upcoming-grid" id="upcomingSection">
  <div class="skeleton" style="height:120px"></div>
  <div class="skeleton" style="height:120px"></div>
  <div class="skeleton" style="height:120px"></div>
</div>

<div class="section-label">Group Standings</div>
<div id="standingsSection">
  <div class="skeleton" style="height:300px"></div>
</div>

<div class="footer">Auto-refreshes every 60s · FIFA World Cup 2026 · sports.bzzoiro.com</div>

<script>
// ─── CONFIG ──────────────────────────────────────────────────────────────
// Free API from BSD (Bzzoiro Sports Data) — sports.bzzoiro.com
// Sign up at https://sports.bzzoiro.com/register — 100% free, no rate limits.
const API_KEY  = '7f925fe5bd00c0a208709e72dd1186425f0872db';
const BASE_URL = 'https://sports.bzzoiro.com';

// World Cup 2026 league ID in BSD's database (verified via debug page)
const WORLD_CUP_LEAGUE_ID = 27;

// ─── TEST MODE ───────────────────────────────────────────────────────────
// Set to true to preview with simulated data (no API calls).
// Set to false to use real live data from BSD.
const TEST_MODE = false;

// ─── FLAG / COUNTRY CODE LOOKUP ──────────────────────────────────────────
// FIFA 3-letter codes — works reliably on any device/font
const FLAGS = {
  'Argentina':'ARG','Australia':'AUS','Austria':'AUT','Belgium':'BEL',
  'Bolivia':'BOL','Bosnia-Herzegovina':'BIH','Bosnia':'BIH','Brazil':'BRA',
  'Burkina Faso':'BFA','Cameroon':'CMR','Canada':'CAN','Cape Verde':'CPV',
  'Chile':'CHI','China':'CHN','Colombia':'COL','Comoros':'COM',
  'Congo DR':'COD','Costa Rica':'CRC','Croatia':'CRO','Czech Republic':'CZE',
  'Czechia':'CZE','Denmark':'DEN','Ecuador':'ECU','Egypt':'EGY',
  'El Salvador':'SLV','England':'ENG','France':'FRA','Georgia':'GEO',
  'Germany':'GER','Ghana':'GHA','Greece':'GRE','Guatemala':'GUA',
  'Honduras':'HON','Hungary':'HUN','Indonesia':'IDN','Iran':'IRN',
  'Iraq':'IRQ','Ireland':'IRL','Israel':'ISR','Italy':'ITA',
  'Ivory Coast':'CIV',"Côte d'Ivoire":'CIV','Jamaica':'JAM','Japan':'JPN',
  'Jordan':'JOR','Kenya':'KEN','Mali':'MLI','Mexico':'MEX',
  'Morocco':'MAR','Netherlands':'NED','New Zealand':'NZL','Nigeria':'NGA',
  'North Macedonia':'MKD','Norway':'NOR','Panama':'PAN','Paraguay':'PAR',
  'Peru':'PER','Poland':'POL','Portugal':'POR','Qatar':'QAT',
  'Romania':'ROU','Saudi Arabia':'KSA','Scotland':'SCO','Senegal':'SEN',
  'Serbia':'SRB','Slovakia':'SVK','Slovenia':'SVN','South Africa':'RSA',
  'South Korea':'KOR','Spain':'ESP','Sweden':'SWE','Switzerland':'SUI',
  'Tanzania':'TAN','Thailand':'THA','Tunisia':'TUN','Turkey':'TUR',
  'USA':'USA','Ukraine':'UKR','United States':'USA','Uruguay':'URU',
  'Uzbekistan':'UZB','Venezuela':'VEN','Wales':'WAL','Zambia':'ZAM',
};
function flag(name) {
  if (!name) return '—';
  const hit = Object.keys(FLAGS).find(k => name.toLowerCase().includes(k.toLowerCase()));
  return hit ? FLAGS[hit] : name.substring(0,3).toUpperCase();
}

// ─── CLOCK ───────────────────────────────────────────────────────────────
function tick() {
  const n = new Date(), p = x => x.toString().padStart(2,'0');
  document.getElementById('clock').textContent = p(n.getHours())+':'+p(n.getMinutes())+':'+p(n.getSeconds());
}
tick(); setInterval(tick, 1000);

// ─── API FETCH ────────────────────────────────────────────────────────────
async function apiFetch(path) {
  const r = await fetch(BASE_URL + path, {
    headers: { 'Authorization': 'Token ' + API_KEY }
  });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

// ─── STATUS HELPERS (BSD status values) ─────────────────────────────────
// BSD: notstarted, inprogress, 1st_half, halftime, 2nd_half, finished, postponed, cancelled
function phaseLabel(status, minute) {
  const map = {
    'notstarted':'Upcoming', 'scheduled':'Upcoming',
    '1st_half':'1st Half', 'halftime':'Half Time', '2nd_half':'2nd Half',
    'extra_time':'Extra Time', 'penalties':'Penalties',
    'inprogress':'Live', 'live':'Live',
    'finished':'Full Time', 'ft':'Full Time',
    'postponed':'Postponed', 'cancelled':'Cancelled',
  };
  if (map[status]) return map[status];
  if (minute) return `${minute}'`;
  return status || '—';
}
function isLivePhase(status) {
  return ['inprogress','live','1st_half','halftime','2nd_half','extra_time','penalties'].includes(status);
}
function isFinalPhase(status) {
  return ['finished','ft'].includes(status);
}

// ─── DATE HELPERS ────────────────────────────────────────────────────────
// Show match dates/times in the tournament's local timezone (US Eastern, UTC-4)
// rather than the viewer's local timezone — otherwise a Mexico-time evening
// match shows as next-morning Singapore time.
const TOURNAMENT_TZ = 'America/New_York';
function fmtKickoff(utcStr) {
  if (!utcStr) return {day:'?',month:'?',time:'?'};
  const d = new Date(utcStr);
  return {
    day:   d.toLocaleString('en-US', { day:'numeric', timeZone: TOURNAMENT_TZ }),
    month: d.toLocaleString('en-US', { month:'short', timeZone: TOURNAMENT_TZ }).toUpperCase(),
    time:  d.toLocaleString('en-US', { hour:'2-digit', minute:'2-digit', timeZone: TOURNAMENT_TZ, hour12: true }),
  };
}

// ─── IMAGE URL HELPERS ───────────────────────────────────────────────────
// BSD's image proxy — no auth needed, cached 365 days
function teamLogo(id) { return id ? `${BASE_URL}/img/team/${id}/?bg=transparent` : ''; }
function venuePhoto(id) { return id ? `${BASE_URL}/img/venue/${id}/` : ''; }

// Extract IDs robustly from BSD event objects
function teamId(team, fallback) {
  if (team && typeof team === 'object' && team.id) return team.id;
  return fallback || null;
}
function venueId(m) {
  if (m.venue && typeof m.venue === 'object' && m.venue.id) return m.venue.id;
  return m.venue_id || m.home_team_obj?.venue_id || null;
}

// ─── RENDER MATCH CARD ───────────────────────────────────────────────────
function renderMatch(m) {
  // BSD fields: home_team, away_team, home_score, away_score, status, current_minute, venue, group
  const home   = (typeof m.home_team === 'string' ? m.home_team : m.home_team?.name) || '—';
  const away   = (typeof m.away_team === 'string' ? m.away_team : m.away_team?.name) || '—';
  const homeId = teamId(m.home_team_obj, m.home_team_id) || teamId(m.home_team);
  const awayId = teamId(m.away_team_obj, m.away_team_id) || teamId(m.away_team);
  const venId  = venueId(m);
  const hs     = m.home_score ?? '—';
  const as_    = m.away_score ?? '—';
  const status = m.status || m.phase || '';
  const live   = isLivePhase(status);
  const fin    = isFinalPhase(status);
  const minute = m.current_minute || m.minute;
  const label  = live && minute ? `${minute}'` : phaseLabel(status, minute);
  const groupName = m.group || m.group_name || '';
  const group  = groupName ? `<span class="group-badge">GROUP ${groupName}</span>` : '';
  const venue  = (typeof m.venue === 'string' ? m.venue : m.venue?.name) || m.stadium || '';
  // Stadium photo as faint backdrop on live cards
  const bgStyle = (live && venId) ? `style="background-image:linear-gradient(135deg, rgba(30,46,38,0.92), rgba(42,26,26,0.92)), url('${venuePhoto(venId)}'); background-size:cover; background-position:center;"` : '';
  const homeLogoHtml = homeId
    ? `<img class="team-logo" src="${teamLogo(homeId)}" alt="${home}" onerror="this.style.display='none';this.nextElementSibling.style.display='inline-flex'"><span class="flag" style="display:none">${flag(home)}</span>`
    : `<span class="flag">${flag(home)}</span>`;
  const awayLogoHtml = awayId
    ? `<img class="team-logo" src="${teamLogo(awayId)}" alt="${away}" onerror="this.style.display='none';this.nextElementSibling.style.display='inline-flex'"><span class="flag" style="display:none">${flag(away)}</span>`
    : `<span class="flag">${flag(away)}</span>`;
  return `
    <div class="match-card ${live?'is-live':''}" ${bgStyle}>
      ${live ? '<div class="live-badge">LIVE</div>' : ''}
      <div class="match-meta">${group}${venue?`<span>${venue}</span>`:''}</div>
      <div class="match-main">
        <div class="team">
          ${homeLogoHtml}
          <div class="team-name">${home}</div>
        </div>
        <div class="score-block">
          <div class="score ${fin?'ft':''}">${hs} · ${as_}</div>
          <div class="score-status ${live?'live-min':''}">${label}</div>
        </div>
        <div class="team">
          ${awayLogoHtml}
          <div class="team-name">${away}</div>
        </div>
      </div>
    </div>`;
}

// ─── RENDER UPCOMING CARD ────────────────────────────────────────────────
function renderUpcoming(m) {
  const home  = (typeof m.home_team === 'string' ? m.home_team : m.home_team?.name) || '—';
  const away  = (typeof m.away_team === 'string' ? m.away_team : m.away_team?.name) || '—';
  const homeId = teamId(m.home_team_obj, m.home_team_id) || teamId(m.home_team);
  const awayId = teamId(m.away_team_obj, m.away_team_id) || teamId(m.away_team);
  const dt    = fmtKickoff(m.event_date || m.kickoff_utc || m.date);
  const venue = (typeof m.venue === 'string' ? m.venue : m.venue?.name) || m.stadium || '';
  const homeLogoHtml = homeId
    ? `<img class="upcoming-logo" src="${teamLogo(homeId)}" alt="${home}" onerror="this.style.display='none';this.nextElementSibling.style.display='inline-flex'"><span class="upcoming-flag" style="display:none">${flag(home)}</span>`
    : `<span class="upcoming-flag">${flag(home)}</span>`;
  const awayLogoHtml = awayId
    ? `<img class="upcoming-logo" src="${teamLogo(awayId)}" alt="${away}" onerror="this.style.display='none';this.nextElementSibling.style.display='inline-flex'"><span class="upcoming-flag" style="display:none">${flag(away)}</span>`
    : `<span class="upcoming-flag">${flag(away)}</span>`;
  return `
    <div class="upcoming-card">
      <div class="upcoming-date">
        <div class="upcoming-day">${dt.day}</div>
        <div class="upcoming-month">${dt.month}</div>
        <div class="upcoming-time">${dt.time}</div>
      </div>
      <div class="upcoming-match">
        <div class="upcoming-team">
          ${homeLogoHtml}
          <span class="upcoming-name">${home}</span>
        </div>
        <span class="upcoming-vs">VS</span>
        <div class="upcoming-team">
          ${awayLogoHtml}
          <span class="upcoming-name">${away}</span>
        </div>
      </div>
      ${venue ? `<div class="upcoming-venue">${venue}</div>` : ''}
    </div>`;
}

// ─── RENDER STANDINGS GROUP ──────────────────────────────────────────────
function renderStandingsGroup(groupName, rows, allGroupNames, currentIndex) {
  const dots = (allGroupNames || []).map((g, i) =>
    `<div class="group-dot ${i === currentIndex ? 'active' : ''}"></div>`
  ).join('');
  const header = `
    <div class="standings-group-label">
      <span>GROUP ${groupName}</span>
      ${dots ? `<div class="group-dots">${dots}</div>` : ''}
    </div>
    <div class="s-grid s-header">
      <div>#</div><div>Team</div>
      <div style="text-align:center">P</div><div style="text-align:center">W</div>
      <div style="text-align:center">D</div><div style="text-align:center">L</div>
      <div style="text-align:center">Pts</div>
    </div>`;
  const body = rows.map((t, i) => {
    const qualify = i < 2 ? 'qualify' : '';
    const out     = i === rows.length-1 && rows.length >= 4 ? 'out' : '';
    return `
      <div class="s-grid s-row ${qualify} ${out}">
        <div><span class="pos">${i+1}</span></div>
        <div style="display:flex;align-items:center">
          ${t.team_id
            ? `<img class="logo-sm" src="${teamLogo(t.team_id)}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='inline-flex'"><span class="flag-sm" style="display:none">${flag(t.team_name)}</span>`
            : `<span class="flag-sm">${flag(t.team_name)}</span>`}
          <span class="cell-name">${t.team_name || '—'}</span>
        </div>
        <div class="cell-stat">${t.played ?? 0}</div>
        <div class="cell-stat">${t.won    ?? 0}</div>
        <div class="cell-stat">${t.drawn  ?? 0}</div>
        <div class="cell-stat">${t.lost   ?? 0}</div>
        <div class="cell-pts">${t.points  ?? 0}</div>
      </div>`;
  }).join('');
  return `<div class="standings-card">${header}${body}</div>`;
}

// ─── STANDINGS CAROUSEL ──────────────────────────────────────────────────
// Stores the currently loaded standings data so rotation can run independently
// of the 60s data refresh.
let _standingsData = {};   // { A: [...rows], B: [...rows], ... }
let _carouselTimer = null;
let _carouselIndex = 0;

function renderStandingsCarousel(standingsData) {
  _standingsData = standingsData;
  const container = document.getElementById('standingsSection');
  const groupNames = Object.keys(standingsData).sort();

  if (groupNames.length === 0) {
    container.innerHTML = '<div class="empty-card" style="height:120px"><div class="empty-msg">No standings data</div></div>';
    return;
  }

  // Render each group as a complete card, but turn them into rotating slides
  const cards = groupNames.map((g, i) => {
    const rows = standingsData[g].sort((a,b) => (b.points??0)-(a.points??0));
    const cardHtml = renderStandingsGroup(g, rows, groupNames, i);
    // Inject the 'rotating' classes into the card root
    return cardHtml.replace(
      'class="standings-card"',
      `class="standings-card rotating ${i===0?'visible':''}"`
    );
  }).join('');

  container.innerHTML = `<div class="standings-carousel">${cards}</div>`;

  _carouselIndex = 0;
  if (_carouselTimer) clearInterval(_carouselTimer);
  if (groupNames.length > 1) {
    _carouselTimer = setInterval(() => {
      const cardEls = container.querySelectorAll('.standings-card.rotating');
      if (cardEls.length === 0) return;
      cardEls[_carouselIndex].classList.remove('visible');
      _carouselIndex = (_carouselIndex + 1) % cardEls.length;
      cardEls[_carouselIndex].classList.add('visible');
    }, 8000);
  }
}

// ─── MAIN LOADER ─────────────────────────────────────────────────────────
async function loadAll() {
  const bar = document.getElementById('statusBar');
  const txt = document.getElementById('statusText');
  const lbl = document.getElementById('liveLabel');


  // ── TEST MODE (fully local — no API call, no key needed) ──
  if (TEST_MODE) {
    const phases = ['1H','1H','1H','HT','2H','2H','2H','FT'];
    const phase  = phases[Math.floor(Date.now() / 15000) % phases.length];
    const testMatch = {
      home_team:'Brazil', away_team:'Argentina',
      home_score: phase==='FT' ? 2 : phase==='2H' ? 2 : 1,
      away_score: 1,
      phase, group_name:'A', stadium:'MetLife Stadium, New Jersey',
    };
    const { liveMatches, upcomingMatches, standingsData } = buildTestData(testMatch);
    lbl.textContent = 'Live Matches';
    bar.className = 'status-bar live';
    txt.innerHTML = `<div class="live-dot"></div> TEST MODE — simulating live data`;
    document.getElementById('liveSection').innerHTML = liveMatches.map(renderMatch).join('');
    document.getElementById('upcomingSection').innerHTML = upcomingMatches.map(renderUpcoming).join('');
    renderStandingsCarousel(standingsData);
    return;
  }

  // ── LIVE MODE ──
  if (API_KEY === 'YOUR_API_KEY_HERE') {
    bar.className = 'status-bar error';
    txt.textContent = '⚠  Add API key, or set TEST_MODE = true to preview';
    document.getElementById('liveSection').innerHTML =
      `<div class="empty-card"><div class="empty-msg">
        Set TEST_MODE = true to preview,<br>or add your key from sports.bzzoiro.com
      </div></div>`;
    document.getElementById('upcomingSection').innerHTML = '';
    document.getElementById('standingsSection').innerHTML = '';
    return;
  }

  try {
    const wcId = WORLD_CUP_LEAGUE_ID;

    // Fetch all World Cup matches for the tournament window
    const today = new Date();
    const dateFrom = '2026-06-11';
    const dateTo   = '2026-07-19';
    const path = `/api/events/?league=${wcId}&date_from=${dateFrom}&date_to=${dateTo}`;
    const all = await apiFetch(path);
    const matches = Array.isArray(all) ? all : (all.results || all.events || []);

    const live      = matches.filter(m => isLivePhase(m.status));
    const finished  = matches.filter(m => isFinalPhase(m.status)).sort((a,b) => new Date(b.event_date) - new Date(a.event_date));
    const scheduled = matches.filter(m => m.status === 'notstarted' || m.status === 'scheduled');

    // 1 — Live or today's matches in the top section
    if (live.length > 0) {
      bar.className = 'status-bar live';
      txt.innerHTML = `<div class="live-dot"></div> LIVE — ${live.length} match${live.length>1?'es':''} in progress`;
      lbl.textContent = 'Live Matches';
      document.getElementById('liveSection').innerHTML = live.slice(0,4).map(renderMatch).join('');
    } else {
      const todayStr = today.toISOString().split('T')[0];
      const todayMatches = matches.filter(m => (m.event_date || '').startsWith(todayStr));
      if (todayMatches.length > 0) {
        lbl.textContent = "Today's Matches";
        document.getElementById('liveSection').innerHTML = todayMatches.slice(0,4).map(renderMatch).join('');
      } else if (finished.length > 0) {
        lbl.textContent = 'Recent Results';
        document.getElementById('liveSection').innerHTML = finished.slice(0,4).map(renderMatch).join('');
      } else {
        lbl.textContent = 'Upcoming Matches';
        const nextMatch = scheduled.sort((a,b) => new Date(a.event_date) - new Date(b.event_date))[0];
        document.getElementById('liveSection').innerHTML =
          `<div class="empty-card"><div class="empty-msg">
            Tournament starts<br><strong>June 11, 2026</strong>
            ${nextMatch ? `<br><br>First match: ${nextMatch.home_team} vs ${nextMatch.away_team}` : ''}
          </div></div>`;
      }
      bar.className = 'status-bar idle';
      txt.textContent = 'No live matches right now';
    }

    // 2 — Upcoming fixtures (next 5 scheduled)
    const nextUp = scheduled
      .filter(m => m.event_date)
      .sort((a,b) => new Date(a.event_date) - new Date(b.event_date))
      .slice(0, 5);
    document.getElementById('upcomingSection').innerHTML =
      nextUp.length > 0
        ? nextUp.map(renderUpcoming).join('')
        : `<div class="empty-card" style="height:100px"><div class="empty-msg">No upcoming fixtures found</div></div>`;

    // 3 — Standings carousel
    try {
      const stData = await apiFetch(`/api/v2/leagues/${wcId}/standings/`);
      const groups = stData.groups || stData.standings || stData.data || [];
      const byGroup = {};
      // BSD v2 standings format: groups array with { name, standings: [...] }
      if (Array.isArray(groups) && groups.length > 0 && groups[0].standings) {
        groups.forEach(g => {
          const groupName = (g.name || '').replace(/^group\s+/i,'').trim() || '?';
          byGroup[groupName] = g.standings.map(row => ({
            team_id:   row.team?.id || row.team_id || null,
            team_name: row.team?.name || row.team_name || row.name,
            played:    row.played ?? row.matches_played ?? 0,
            won:       row.won ?? row.wins ?? 0,
            drawn:     row.drawn ?? row.draws ?? 0,
            lost:      row.lost ?? row.losses ?? 0,
            points:    row.points ?? 0,
          }));
        });
      } else {
        // Fallback: flat list with group field
        const rows = Array.isArray(stData) ? stData : (stData.results || stData.standings || []);
        rows.forEach(row => {
          const g = (row.group || row.group_name || '?').replace(/^group\s+/i,'').trim();
          if (!byGroup[g]) byGroup[g] = [];
          byGroup[g].push({
            team_id:   row.team?.id || row.team_id || null,
            team_name: row.team?.name || row.team_name || row.name,
            played:    row.played ?? 0,
            won:       row.won ?? 0,
            drawn:     row.drawn ?? 0,
            lost:      row.lost ?? 0,
            points:    row.points ?? 0,
          });
        });
      }
      if (Object.keys(byGroup).length > 0) {
        renderStandingsCarousel(byGroup);
      } else {
        document.getElementById('standingsSection').innerHTML = `<div class="empty-card" style="height:120px"><div class="empty-msg">Standings not yet available<br>(tournament hasn't started)</div></div>`;
      }
    } catch(e) {
      document.getElementById('standingsSection').innerHTML = `<div class="empty-card" style="height:120px"><div class="empty-msg">Standings not yet available<br>(tournament hasn't started)</div></div>`;
    }

  } catch(err) {
    bar.className = 'status-bar error';
    txt.textContent = '⚠  Error: ' + err.message;
    console.error(err);
  }
}

loadAll();
setInterval(loadAll, 60_000);
</script>
