<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1440">
<title>FIFA World Cup 2026 — Live Scores</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap');

  :root {
    --gold: #C9982A; --gold-light: #F0C755;
    --dark: #0A0F0D; --surface: #1E2E26; --surface2: #243626;
    --text: #F0EDE4; --text2: #9BB09F;
    --live: #E8453C; --border: rgba(255,255,255,0.07);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1440px; background:var(--dark); color:var(--text); font-family:'Barlow',sans-serif; }
  body { display:flex; flex-direction:column; padding:48px 60px 80px; gap:36px; min-height:2560px; }

  /* HEADER */
  .header { display:flex; flex-direction:column; align-items:center; gap:10px; padding:32px 0 24px; border-bottom:1px solid rgba(201,152,42,0.3); position:relative; }
  .header::before { content:''; position:absolute; bottom:-1px; left:50%; transform:translateX(-50%); width:200px; height:2px; background:var(--gold); }
  .header-title { font-family:'Bebas Neue',sans-serif; font-size:96px; letter-spacing:6px; line-height:0.95; text-align:center; }
  .header-sub { font-family:'Barlow Condensed',sans-serif; font-size:32px; font-weight:600; letter-spacing:8px; color:var(--gold); text-transform:uppercase; }
  .header-host { font-size:22px; color:var(--text2); letter-spacing:3px; }

  /* STATUS BAR */
  .status-bar { display:flex; align-items:center; gap:16px; border-radius:8px; padding:14px 28px; font-family:'Barlow Condensed',sans-serif; font-size:28px; font-weight:700; letter-spacing:3px; }
  .status-bar.live   { background:var(--live); color:white; }
  .status-bar.idle   { background:var(--surface); color:var(--text2); border:1px solid var(--border); }
  .status-bar.error  { background:#2a1010; color:#e87070; border:1px solid rgba(232,70,70,0.3); }
  .live-dot { width:14px; height:14px; border-radius:50%; background:white; animation:pulse 1.2s ease-in-out infinite; flex-shrink:0; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(0.7)} }
  .clock { margin-left:auto; font-size:24px; }

  /* SECTION LABEL */
  .section-label { font-family:'Barlow Condensed',sans-serif; font-size:26px; font-weight:700; letter-spacing:5px; color:var(--gold); text-transform:uppercase; display:flex; align-items:center; gap:16px; }
  .section-label::after { content:''; flex:1; height:1px; background:rgba(201,152,42,0.25); }

  /* MATCH CARD */
  .match-card { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:32px 44px; display:flex; flex-direction:column; gap:18px; position:relative; overflow:hidden; }
  .match-card.is-live { border-color:rgba(232,69,60,0.5); background:linear-gradient(135deg,#1E2E26,#2A1A1A); }
  .live-badge { position:absolute; top:20px; right:24px; font-family:'Barlow Condensed',sans-serif; font-size:20px; font-weight:700; letter-spacing:3px; color:var(--live); }
  .match-meta { display:flex; align-items:center; gap:14px; font-size:20px; color:var(--text2); font-weight:500; letter-spacing:1px; }
  .group-badge { background:var(--gold); color:var(--dark); font-family:'Barlow Condensed',sans-serif; font-size:18px; font-weight:700; letter-spacing:2px; padding:3px 12px; border-radius:4px; }
  .match-main { display:flex; align-items:center; justify-content:space-between; gap:20px; }
  .team { display:flex; flex-direction:column; align-items:center; gap:12px; flex:1; }
  .flag { font-size:68px; line-height:1; }
  .team-name { font-family:'Barlow Condensed',sans-serif; font-size:36px; font-weight:700; letter-spacing:2px; text-align:center; text-transform:uppercase; line-height:1.1; }
  .score-block { display:flex; flex-direction:column; align-items:center; gap:8px; min-width:200px; }
  .score { font-family:'Bebas Neue',sans-serif; font-size:108px; line-height:0.9; letter-spacing:8px; }
  .score.ft { color:var(--text2); }
  .score-status { font-family:'Barlow Condensed',sans-serif; font-size:22px; font-weight:600; letter-spacing:3px; color:var(--text2); }
  .score-status.live-min { color:var(--live); }
  .empty-card { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:48px; display:flex; justify-content:center; align-items:center; }
  .empty-msg { font-family:'Barlow Condensed',sans-serif; font-size:28px; color:var(--text2); letter-spacing:2px; text-align:center; line-height:1.6; }

  /* UPCOMING */
  .upcoming-card { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:28px 44px; display:flex; align-items:center; gap:32px; }
  .upcoming-date { display:flex; flex-direction:column; align-items:center; min-width:120px; border-right:1px solid rgba(255,255,255,0.1); padding-right:32px; }
  .upcoming-day { font-family:'Bebas Neue',sans-serif; font-size:56px; line-height:1; color:var(--gold-light); }
  .upcoming-month { font-family:'Barlow Condensed',sans-serif; font-size:24px; font-weight:700; letter-spacing:3px; color:var(--text2); text-transform:uppercase; }
  .upcoming-time { font-size:20px; color:var(--text2); margin-top:4px; }
  .upcoming-match { flex:1; display:flex; align-items:center; justify-content:space-between; gap:20px; }
  .upcoming-team { display:flex; align-items:center; gap:14px; }
  .upcoming-flag { font-size:44px; }
  .upcoming-name { font-family:'Barlow Condensed',sans-serif; font-size:34px; font-weight:700; letter-spacing:1px; }
  .upcoming-vs { font-family:'Bebas Neue',sans-serif; font-size:36px; color:var(--text2); letter-spacing:3px; }
  .upcoming-venue { font-size:18px; color:var(--text2); margin-left:auto; text-align:right; line-height:1.5; min-width:180px; }

  /* STANDINGS */
  .standings-card { background:var(--surface); border:1px solid var(--border); border-radius:16px; overflow:hidden; margin-bottom:18px; }
  .standings-group-label { padding:14px 24px; font-family:'Barlow Condensed',sans-serif; font-size:20px; font-weight:700; letter-spacing:3px; color:var(--gold); background:rgba(201,152,42,0.08); border-bottom:1px solid rgba(255,255,255,0.05); }
  .s-grid { display:grid; grid-template-columns:52px 1fr 56px 56px 56px 56px 80px; }
  .s-header { background:var(--surface2); border-bottom:1px solid rgba(255,255,255,0.08); }
  .s-header > div { padding:18px 12px; font-family:'Barlow Condensed',sans-serif; font-size:20px; font-weight:700; letter-spacing:2px; color:var(--text2); text-transform:uppercase; }
  .s-row { border-bottom:1px solid rgba(255,255,255,0.05); }
  .s-row:last-child { border-bottom:none; }
  .s-row.qualify { border-left:4px solid var(--gold); }
  .s-row.out { opacity:0.4; }
  .s-row > div { padding:20px 12px; display:flex; align-items:center; }
  .pos { font-family:'Barlow Condensed',sans-serif; font-size:26px; font-weight:700; color:var(--text2); }
  .flag-sm { font-size:32px; }
  .cell-name { font-family:'Barlow Condensed',sans-serif; font-size:28px; font-weight:600; letter-spacing:1px; margin-left:14px; }
  .cell-stat { font-size:24px; color:var(--text2); justify-content:center; }
  .cell-pts { font-family:'Bebas Neue',sans-serif; font-size:34px; justify-content:center; }

  /* SKELETONS */
  .skeleton { background:var(--surface); border:1px solid var(--border); border-radius:16px; animation:shimmer 1.5s infinite; }
  @keyframes shimmer { 0%,100%{opacity:0.4} 50%{opacity:0.8} }

  .matches-grid, .upcoming-grid { display:flex; flex-direction:column; gap:18px; }
  .footer { margin-top:auto; text-align:center; font-size:20px; color:rgba(155,176,159,0.4); letter-spacing:2px; padding-top:20px; border-top:1px solid rgba(255,255,255,0.05); }
</style>
</head>
<body>

<div class="header">
  <div style="font-size:52px;margin-bottom:4px">🏆</div>
  <div class="header-title">World Cup 2026</div>
  <div class="header-sub">FIFA World Cup 2026</div>
  <div class="header-host">USA · CANADA · MEXICO</div>
</div>

<div class="status-bar idle" id="statusBar">
  <span id="statusText">Loading…</span>
  <span class="clock" id="clock"></span>
</div>

<div class="section-label" id="liveLabel">Today's Matches</div>
<div class="matches-grid" id="liveSection">
  <div class="skeleton" style="height:200px"></div>
  <div class="skeleton" style="height:200px"></div>
</div>

<div class="section-label">Upcoming Fixtures</div>
<div class="upcoming-grid" id="upcomingSection">
  <div class="skeleton" style="height:120px"></div>
  <div class="skeleton" style="height:120px"></div>
  <div class="skeleton" style="height:120px"></div>
</div>

<div class="section-label">Group Standings</div>
<div id="standingsSection">
  <div class="skeleton" style="height:300px"></div>
</div>

<div class="footer">Auto-refreshes every 60s · FIFA World Cup 2026 · wc2026api.com</div>

<script>
// ─── CONFIG ──────────────────────────────────────────────────────────────
// Get your key at https://wc2026api.com  ($4.99 one-time for the full tournament)
const API_KEY  = 'YOUR_API_KEY_HERE';
const BASE_URL = 'https://api.wc2026api.com';

// ─── FLAG LOOKUP ─────────────────────────────────────────────────────────
const FLAGS = {
  'Argentina':'🇦🇷','Australia':'🇦🇺','Austria':'🇦🇹','Belgium':'🇧🇪',
  'Bolivia':'🇧🇴','Bosnia':'🇧🇦','Bosnia-Herzegovina':'🇧🇦','Brazil':'🇧🇷',
  'Burkina Faso':'🇧🇫','Cameroon':'🇨🇲','Canada':'🇨🇦','Cape Verde':'🇨🇻',
  'Chile':'🇨🇱','China':'🇨🇳','Colombia':'🇨🇴','Comoros':'🇰🇲',
  'Congo DR':'🇨🇩','Costa Rica':'🇨🇷','Croatia':'🇭🇷','Czech Republic':'🇨🇿',
  'Czechia':'🇨🇿','Denmark':'🇩🇰','Ecuador':'🇪🇨','Egypt':'🇪🇬',
  'El Salvador':'🇸🇻','England':'🏴󠁧󠁢󠁥󠁮󠁧󠁿','France':'🇫🇷','Georgia':'🇬🇪',
  'Germany':'🇩🇪','Ghana':'🇬🇭','Greece':'🇬🇷','Guatemala':'🇬🇹',
  'Honduras':'🇭🇳','Hungary':'🇭🇺','Indonesia':'🇮🇩','Iran':'🇮🇷',
  'Iraq':'🇮🇶','Ireland':'🇮🇪','Israel':'🇮🇱','Italy':'🇮🇹',
  'Ivory Coast':'🇨🇮',"Côte d'Ivoire":'🇨🇮','Jamaica':'🇯🇲','Japan':'🇯🇵',
  'Jordan':'🇯🇴','Kenya':'🇰🇪','Mali':'🇲🇱','Mexico':'🇲🇽',
  'Morocco':'🇲🇦','Netherlands':'🇳🇱','New Zealand':'🇳🇿','Nigeria':'🇳🇬',
  'North Macedonia':'🇲🇰','Norway':'🇳🇴','Panama':'🇵🇦','Paraguay':'🇵🇾',
  'Peru':'🇵🇪','Poland':'🇵🇱','Portugal':'🇵🇹','Qatar':'🇶🇦',
  'Romania':'🇷🇴','Saudi Arabia':'🇸🇦','Scotland':'🏴󠁧󠁢󠁳󠁣󠁴󠁿','Senegal':'🇸🇳',
  'Serbia':'🇷🇸','Slovakia':'🇸🇰','Slovenia':'🇸🇮','South Africa':'🇿🇦',
  'South Korea':'🇰🇷','Spain':'🇪🇸','Sweden':'🇸🇪','Switzerland':'🇨🇭',
  'Tanzania':'🇹🇿','Thailand':'🇹🇭','Tunisia':'🇹🇳','Turkey':'🇹🇷',
  'USA':'🇺🇸','Ukraine':'🇺🇦','United States':'🇺🇸','Uruguay':'🇺🇾',
  'Uzbekistan':'🇺🇿','Venezuela':'🇻🇪','Wales':'🏴󠁧󠁢󠁷󠁬󠁳󠁿','Zambia':'🇿🇲',
};
function flag(name) {
  if (!name) return '🏳';
  const hit = Object.keys(FLAGS).find(k => name.toLowerCase().includes(k.toLowerCase()));
  return hit ? FLAGS[hit] : '🏳';
}

// ─── CLOCK ───────────────────────────────────────────────────────────────
function tick() {
  const n = new Date(), p = x => x.toString().padStart(2,'0');
  document.getElementById('clock').textContent = p(n.getHours())+':'+p(n.getMinutes())+':'+p(n.getSeconds());
}
tick(); setInterval(tick, 1000);

// ─── API FETCH ────────────────────────────────────────────────────────────
async function apiFetch(path) {
  const r = await fetch(BASE_URL + path, {
    headers: { 'Authorization': 'Bearer ' + API_KEY }
  });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

// ─── PHASE → LABEL ───────────────────────────────────────────────────────
// wc2026api phases: PRE, 1H, HT, 2H, ET1, ET2, PEN, FT, FT_PEN
function phaseLabel(phase, status) {
  if (!phase) return status || '—';
  const map = { PRE:'Upcoming', '1H':'1st Half', HT:'Half Time', '2H':'2nd Half',
    ET1:'Extra Time', ET2:'Extra Time', PEN:'Penalties', FT:'Full Time', FT_PEN:'FT (Pens)' };
  return map[phase] || phase;
}
function isLivePhase(phase) { return ['1H','HT','2H','ET1','ET2','PEN'].includes(phase); }
function isFinalPhase(phase) { return ['FT','FT_PEN'].includes(phase); }

// ─── DATE HELPERS ────────────────────────────────────────────────────────
function fmtKickoff(utcStr) {
  if (!utcStr) return {day:'?',month:'?',time:'?'};
  const d = new Date(utcStr);
  return {
    day:   d.getDate().toString(),
    month: d.toLocaleString('en',{month:'short'}).toUpperCase(),
    time:  d.toLocaleTimeString('en',{hour:'2-digit',minute:'2-digit'}),
  };
}

// ─── RENDER MATCH CARD ───────────────────────────────────────────────────
function renderMatch(m) {
  const home   = m.home_team || '—';
  const away   = m.away_team || '—';
  const hs     = m.home_score ?? '—';
  const as_    = m.away_score ?? '—';
  const phase  = m.phase || '';
  const live   = isLivePhase(phase);
  const fin    = isFinalPhase(phase);
  const label  = phaseLabel(phase, m.status);
  const group  = m.group_name ? `<span class="group-badge">GROUP ${m.group_name}</span>` : '';
  const venue  = m.stadium || '';
  return `
    <div class="match-card ${live?'is-live':''}">
      ${live ? '<div class="live-badge">LIVE</div>' : ''}
      <div class="match-meta">${group}${venue?`<span>${venue}</span>`:''}</div>
      <div class="match-main">
        <div class="team">
          <div class="flag">${flag(home)}</div>
          <div class="team-name">${home}</div>
        </div>
        <div class="score-block">
          <div class="score ${fin?'ft':''}">${hs} · ${as_}</div>
          <div class="score-status ${live?'live-min':''}">${label}</div>
        </div>
        <div class="team">
          <div class="flag">${flag(away)}</div>
          <div class="team-name">${away}</div>
        </div>
      </div>
    </div>`;
}

// ─── RENDER UPCOMING CARD ────────────────────────────────────────────────
function renderUpcoming(m) {
  const home  = m.home_team || '—';
  const away  = m.away_team || '—';
  const dt    = fmtKickoff(m.kickoff_utc);
  const venue = m.stadium || '';
  return `
    <div class="upcoming-card">
      <div class="upcoming-date">
        <div class="upcoming-day">${dt.day}</div>
        <div class="upcoming-month">${dt.month}</div>
        <div class="upcoming-time">${dt.time}</div>
      </div>
      <div class="upcoming-match">
        <div class="upcoming-team">
          <span class="upcoming-flag">${flag(home)}</span>
          <span class="upcoming-name">${home}</span>
        </div>
        <span class="upcoming-vs">VS</span>
        <div class="upcoming-team">
          <span class="upcoming-flag">${flag(away)}</span>
          <span class="upcoming-name">${away}</span>
        </div>
      </div>
      ${venue ? `<div class="upcoming-venue">${venue}</div>` : ''}
    </div>`;
}

// ─── RENDER STANDINGS GROUP ──────────────────────────────────────────────
function renderStandingsGroup(groupName, rows) {
  const header = `
    <div class="standings-group-label">GROUP ${groupName}</div>
    <div class="s-grid s-header">
      <div>#</div><div>Team</div>
      <div style="text-align:center">P</div><div style="text-align:center">W</div>
      <div style="text-align:center">D</div><div style="text-align:center">L</div>
      <div style="text-align:center">Pts</div>
    </div>`;
  const body = rows.map((t, i) => {
    const qualify = i < 2 ? 'qualify' : '';
    const out     = i === rows.length-1 && rows.length >= 4 ? 'out' : '';
    return `
      <div class="s-grid s-row ${qualify} ${out}">
        <div><span class="pos">${i+1}</span></div>
        <div style="display:flex;align-items:center">
          <span class="flag-sm">${flag(t.team_name)}</span>
          <span class="cell-name">${t.team_name || '—'}</span>
        </div>
        <div class="cell-stat">${t.played ?? 0}</div>
        <div class="cell-stat">${t.won    ?? 0}</div>
        <div class="cell-stat">${t.drawn  ?? 0}</div>
        <div class="cell-stat">${t.lost   ?? 0}</div>
        <div class="cell-pts">${t.points  ?? 0}</div>
      </div>`;
  }).join('');
  return `<div class="standings-card">${header}${body}</div>`;
}

// ─── MAIN LOADER ─────────────────────────────────────────────────────────
async function loadAll() {
  const bar  = document.getElementById('statusBar');
  const txt  = document.getElementById('statusText');
  const lbl  = document.getElementById('liveLabel');

  if (API_KEY === 'YOUR_API_KEY_HERE') {
    bar.className = 'status-bar error';
    txt.textContent = '⚠  Set your API key — get one free at wc2026api.com';
    document.getElementById('liveSection').innerHTML =
      `<div class="empty-card"><div class="empty-msg">
        Open this file and replace<br><strong>YOUR_API_KEY_HERE</strong><br>with your key from wc2026api.com<br><br>
        Free tier (100 req/day) or Pro ($4.99 one-time)
      </div></div>`;
    document.getElementById('upcomingSection').innerHTML = '';
    document.getElementById('standingsSection').innerHTML = '';
    return;
  }

  try {
    // 1 — Live matches
    const allMatches = await apiFetch('/matches');
    const matches    = Array.isArray(allMatches) ? allMatches : (allMatches.data || allMatches.matches || []);

    const live      = matches.filter(m => isLivePhase(m.phase));
    const finished  = matches.filter(m => isFinalPhase(m.phase));
    const scheduled = matches.filter(m => m.phase === 'PRE' || m.status === 'scheduled');

    // Status bar
    if (live.length > 0) {
      bar.className = 'status-bar live';
      txt.innerHTML = `<div class="live-dot"></div> LIVE — ${live.length} match${live.length>1?'es':''} in progress`;
      lbl.textContent = 'Live Matches';
      document.getElementById('liveSection').innerHTML = live.slice(0,4).map(renderMatch).join('');
    } else {
      // Show today's finished/upcoming results
      const todayStr = new Date().toISOString().split('T')[0];
      const todayMatches = matches.filter(m => {
        const d = m.kickoff_utc || m.kickoff || '';
        return d.startsWith(todayStr);
      });
      if (todayMatches.length > 0) {
        lbl.textContent = "Today's Matches";
        document.getElementById('liveSection').innerHTML = todayMatches.slice(0,4).map(renderMatch).join('');
      } else if (finished.length > 0) {
        lbl.textContent = 'Recent Results';
        document.getElementById('liveSection').innerHTML = finished.slice(-4).reverse().map(renderMatch).join('');
      } else {
        lbl.textContent = 'Upcoming Matches';
        document.getElementById('liveSection').innerHTML = `<div class="empty-card"><div class="empty-msg">Tournament starts June 11, 2026</div></div>`;
      }
      bar.className = 'status-bar idle';
      txt.textContent = live.length === 0 ? 'No live matches right now' : '';
    }

    // 2 — Upcoming fixtures (next 3 scheduled)
    const nextUp = scheduled
      .filter(m => m.kickoff_utc)
      .sort((a,b) => new Date(a.kickoff_utc) - new Date(b.kickoff_utc))
      .slice(0, 3);
    document.getElementById('upcomingSection').innerHTML =
      nextUp.length > 0
        ? nextUp.map(renderUpcoming).join('')
        : `<div class="empty-card" style="height:100px"><div class="empty-msg">No upcoming fixtures found</div></div>`;

    // 3 — Standings (groups A, B, C, D shown)
    let standHtml = '';
    try {
      const standings = await apiFetch('/standings');
      const data = Array.isArray(standings) ? standings : (standings.data || standings.standings || []);
      // Group by group_name
      const byGroup = {};
      data.forEach(row => {
        const g = row.group_name || row.group || '?';
        if (!byGroup[g]) byGroup[g] = [];
        byGroup[g].push(row);
      });
      // Sort by points desc within each group
      const groupNames = Object.keys(byGroup).sort();
      for (const g of groupNames) {
        const rows = byGroup[g].sort((a,b) => (b.points??0)-(a.points??0));
        standHtml += renderStandingsGroup(g, rows);
      }
    } catch(e) {
      standHtml = `<div class="empty-card" style="height:120px"><div class="empty-msg">Standings not yet available</div></div>`;
    }
    document.getElementById('standingsSection').innerHTML = standHtml || `<div class="empty-card" style="height:120px"><div class="empty-msg">No standings data</div></div>`;

  } catch(err) {
    bar.className = 'status-bar error';
    txt.textContent = '⚠  Error: ' + err.message;
    console.error(err);
  }
}

loadAll();
setInterval(loadAll, 60_000);
</script>
</body>
</html>
