<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1440,height=2560">
<title>World Cup Dashboard</title>

<style>

:root{
    --bg:#08131f;
    --panel:#13283f;
    --accent:#ffd700;
    --text:#ffffff;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:var(--bg);
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
}

body{
    display:flex;
    flex-direction:column;
}

header{
    height:220px;
    background:#0c1f33;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    border-bottom:4px solid var(--accent);
}

header h1{
    font-size:72px;
    letter-spacing:4px;
}

#clock{
    font-size:40px;
    margin-top:10px;
}

#sectionTitle{
    text-align:center;
    font-size:52px;
    padding:30px;
    color:var(--accent);
}

#content{
    flex:1;
    padding:20px 40px;
    overflow:hidden;
}

.card{
    background:var(--panel);
    border-radius:20px;
    padding:25px;
    margin-bottom:18px;
}

.match{
    display:flex;
    justify-content:space-between;
    align-items:center;
    min-height:120px;
}

.teamblock{
    width:55%;
}

.team{
    font-size:34px;
    line-height:1.4;
}

.score{
    font-size:56px;
    font-weight:bold;
    color:var(--accent);
}

.time{
    font-size:28px;
    color:#bbbbbb;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    font-size:28px;
    padding:18px;
    background:#1f3d60;
}

td{
    font-size:28px;
    padding:18px;
    border-bottom:1px solid rgba(255,255,255,.1);
}

.footer{
    height:80px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:24px;
    color:#999;
}

.fade{
    animation:fadein 1s;
}

@keyframes fadein{
    from{opacity:0;}
    to{opacity:1;}
}

</style>
</head>
<body>

<header>
    <h1>FIFA WORLD CUP</h1>
    <div id="clock"></div>
</header>

<div id="sectionTitle">Loading...</div>

<div id="content"></div>

<div class="footer">
    Auto Refresh Every 5 Minutes
</div>

<script>

const API_KEY = "e0dc9dd7d18440ba870d4916dd774519";

/*
Verify competition ID before tournament starts.
2000 is commonly used for FIFA World Cup.
*/
const COMPETITION_ID = 2000;

let matches = [];
let standings = [];
let page = 0;

function updateClock(){
    document.getElementById("clock").innerHTML =
        new Date().toUTCString();
}

setInterval(updateClock,1000);
updateClock();

async function loadData(){

    try{

        const matchResponse = await fetch(
            `https://api.football-data.org/v4/competitions/${COMPETITION_ID}/matches`,
            {
                headers:{
                    "X-Auth-Token":API_KEY
                }
            }
        );

        const standingResponse = await fetch(
            `https://api.football-data.org/v4/competitions/${COMPETITION_ID}/standings`,
            {
                headers:{
                    "X-Auth-Token":API_KEY
                }
            }
        );

        const matchData = await matchResponse.json();
        const standingData = await standingResponse.json();

        matches = matchData.matches || [];
        standings = standingData.standings || [];

        renderPage();

    } catch(error){

        document.getElementById("content").innerHTML =
            "<h2>Unable to load World Cup data</h2>";

        console.error(error);
    }
}

function renderFixtures(){

    const upcoming = matches
        .filter(m=>m.status==="SCHEDULED")
        .slice(0,8);

    document.getElementById("sectionTitle").innerHTML =
        "UPCOMING MATCHES";

    let html = "";

    upcoming.forEach(m=>{

        html += `
        <div class="card match fade">
            <div class="teamblock">
                <div class="team">${m.homeTeam.name}</div>
                <div class="team">${m.awayTeam.name}</div>
            </div>
            <div class="time">
                ${new Date(m.utcDate).toUTCString()}
            </div>
        </div>`;
    });

    document.getElementById("content").innerHTML = html;
}

function renderResults(){

    const finished = matches
        .filter(m=>m.status==="FINISHED")
        .reverse()
        .slice(0,10);

    document.getElementById("sectionTitle").innerHTML =
        "LATEST RESULTS";

    let html="";

    finished.forEach(m=>{

        html += `
        <div class="card match fade">

            <div class="teamblock">
                <div class="team">${m.homeTeam.name}</div>
                <div class="team">${m.awayTeam.name}</div>
            </div>

            <div class="score">
                ${m.score.fullTime.home} - ${m.score.fullTime.away}
            </div>

        </div>`;
    });

    document.getElementById("content").innerHTML = html;
}

function renderStandings(){

    document.getElementById("sectionTitle").innerHTML =
        "GROUP STANDINGS";

    let html = `
    <div class="card fade">
    <table>
    <tr>
    <th>Team</th>
    <th>Pts</th>
    <th>GD</th>
    </tr>
    `;

    if(standings.length){

        standings[0].table.slice(0,16).forEach(team=>{

            html += `
            <tr>
                <td>${team.team.name}</td>
                <td>${team.points}</td>
                <td>${team.goalDifference}</td>
            </tr>`;
        });
    }

    html += "</table></div>";

    document.getElementById("content").innerHTML = html;
}

function renderPage(){

    switch(page){

        case 0:
            renderFixtures();
            break;

        case 1:
            renderResults();
            break;

        case 2:
            renderStandings();
            break;
    }
}

setInterval(()=>{

    page++;

    if(page>2){
        page=0;
    }

    renderPage();

},20000);

loadData();

setInterval(loadData,300000);

</script>

</body>
</html>
